openapi: 3.0.3
info:
  title: FilmLog API
  version: 1.0.0
  description: >
    REST API untuk watchlist dan review film, dengan rekomendasi Gemini yang hanya memilih
    dari film di database. Klik Authorize dan tempel token dari endpoint login untuk mencoba
    route yang dilindungi.
servers:
  - url: /api
tags:
  - name: Auth
  - name: Movies
  - name: Watchlist
  - name: Watched
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Mendaftarkan user baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, minLength: 2, maxLength: 30, example: budi_film }
                email: { type: string, format: email, example: budi@example.com }
                password: { type: string, minLength: 8, description: Maksimal 72 byte, example: rahasia123 }
      responses:
        '201':
          description: User dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email atau username sudah terdaftar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Login dan mendapatkan JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: budi@example.com }
                password: { type: string, example: rahasia123 }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: JWT yang berlaku 7 hari }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /movies:
    get:
      tags: [Movies]
      summary: Daftar film
      parameters:
        - { name: genre, in: query, schema: { type: string }, example: Sci-Fi, description: Nama genre persis, tanpa membedakan huruf besar kecil }
        - { name: search, in: query, schema: { type: string }, example: Nolan, description: Mencari di judul dan sutradara }
        - { name: shuffle, in: query, schema: { type: string, enum: ['true', 'false'] }, description: Mengacak urutan hasil }
      responses:
        '200':
          description: Daftar film, bisa kosong
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Movie' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /movies/{id}:
    get:
      tags: [Movies]
      summary: Detail satu film
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 }, example: 14 }
      responses:
        '200':
          description: Detail film
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /movies/recommend:
    post:
      tags: [Movies]
      summary: Rekomendasi film dari Gemini
      description: >
        Publik, dengan token opsional. Kalau token valid, film yang sudah ditonton dikeluarkan
        dari kandidat dan rating user dipakai sebagai petunjuk selera. movie_id selalu ada di database.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, minLength: 1, maxLength: 500, example: Saya mau film misteri dengan alur lambat dan atmosfer mendalam }
      responses:
        '200':
          description: Film terpilih
          content:
            application/json:
              schema:
                type: object
                properties:
                  movie_id: { type: integer, example: 14 }
                  reasoning: { type: string, example: Memento cocok dengan preferensi misteri Anda karena... }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: Gemini tetap memberi jawaban tidak valid setelah dicoba ulang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Gemini tidak tersedia, kuota habis, atau API key belum diisi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /watchlist:
    get:
      tags: [Watchlist]
      summary: Watchlist user yang sedang login
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Item watchlist, terbaru lebih dulu
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WatchlistItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Watchlist]
      summary: Menambahkan film ke watchlist
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [movieId]
              properties:
                movieId: { type: integer, example: 1 }
      responses:
        '201':
          description: Film ditambahkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchlistItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Film sudah ada di watchlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /watchlist/{movieId}:
    delete:
      tags: [Watchlist]
      summary: Menghapus film dari watchlist
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: movieId, in: path, required: true, schema: { type: integer, minimum: 1 }, example: 1 }
      responses:
        '204': { description: Film dihapus }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /watched:
    get:
      tags: [Watched]
      summary: Riwayat tontonan dan review user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Riwayat, terbaru diperbarui lebih dulu
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WatchedEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Watched]
      summary: Mencatat film yang ditonton, atau memperbarui catatan yang sudah ada
      description: Satu user punya satu review per film. Kiriman berikutnya untuk film yang sama menimpa review lama.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [movieId, rating, review]
              properties:
                movieId: { type: integer, example: 1 }
                rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
                review: { type: string, minLength: 1, maxLength: 2000, example: Filmnya luar biasa }
      responses:
        '201':
          description: Catatan baru dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchedEntry' }
        '200':
          description: Catatan lama diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchedEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        created_at: { type: string, format: date-time }
    Movie:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        year: { type: integer }
        director: { type: string }
        genres: { type: array, items: { type: string } }
        rating: { type: number, description: Rating umum film, skala 10 }
        duration: { type: string }
        synopsis: { type: string }
        poster_url: { type: string }
        cast: { type: array, items: { type: string } }
    WatchlistItem:
      type: object
      properties:
        movie_id: { type: integer }
        added_at: { type: string, format: date-time }
        movie: { $ref: '#/components/schemas/Movie' }
    WatchedEntry:
      type: object
      properties:
        movie_id: { type: integer }
        rating: { type: integer, description: Rating dari user, 1 sampai 5 }
        review: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        movie: { $ref: '#/components/schemas/Movie' }
  responses:
    BadRequest:
      description: Input tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Token tidak ada atau tidak valid, atau kredensial salah
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Melewati batas jumlah request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
